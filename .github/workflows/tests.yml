name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "hardware/**", "*.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install pytest numpy opencv-python-headless pillow
      - name: Test
        run: python -m pytest -q
