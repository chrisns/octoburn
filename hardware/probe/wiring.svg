<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="bold" fill="#111">Laser height probe: wiring (no extra parts)</text>
  <text x="30" y="64" font-size="14" fill="#444">ESP32-C3 SuperMini (0.42" OLED) + BLTouch-style clone. Five wires, straight to the board. Check your clone's wire colours against its own label.</text>

  <!-- ===== ESP32-C3 SuperMini ===== -->
  <g transform="translate(60,110)">
    <rect x="0" y="0" width="230" height="330" rx="12" fill="#5b2a86" stroke="#2d1544" stroke-width="2"/>
    <rect x="80" y="-14" width="70" height="30" rx="5" fill="#bbb" stroke="#666"/>
    <text x="115" y="6" font-size="11" text-anchor="middle" fill="#222">USB-C</text>
    <rect x="62" y="70" width="106" height="66" fill="#0a0a0a" stroke="#333"/>
    <text x="115" y="108" font-size="11" text-anchor="middle" fill="#7fd">OLED 72x40</text>
    <text x="115" y="170" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">ESP32-C3</text>
    <text x="115" y="188" font-size="11" text-anchor="middle" fill="#ddd">SuperMini 0.42" OLED</text>
    <text x="115" y="206" font-size="10" text-anchor="middle" fill="#ccc">OLED: SDA GPIO5, SCL GPIO6</text>
    <text x="115" y="222" font-size="10" text-anchor="middle" fill="#ccc">LED GPIO8 (lights on trigger)</text>
    <text x="115" y="238" font-size="10" text-anchor="middle" fill="#ccc">BOOT GPIO9 (don't use)</text>
    <g font-size="12" fill="#fff">
      <circle cx="16" cy="40"  r="6" fill="#e33"/><text x="28" y="44">5V</text>
      <circle cx="16" cy="76"  r="6" fill="#222" stroke="#fff"/><text x="28" y="80">GND</text>
      <circle cx="16" cy="112" r="5" fill="#bbb"/><text x="28" y="116" fill="#bbb">3V3</text>
      <circle cx="16" cy="148" r="5" fill="#bbb"/><text x="28" y="152" fill="#bbb">20</text>
      <circle cx="16" cy="184" r="5" fill="#bbb"/><text x="28" y="188" fill="#bbb">21</text>
      <circle cx="16" cy="220" r="5" fill="#bbb"/><text x="28" y="224" fill="#bbb">2</text>
      <circle cx="16" cy="256" r="5" fill="#bbb"/><text x="28" y="260" fill="#bbb">1</text>
      <circle cx="16" cy="292" r="5" fill="#bbb"/><text x="28" y="296" fill="#bbb">0</text>
    </g>
    <g font-size="12" fill="#fff" text-anchor="end">
      <circle cx="214" cy="40"  r="5" fill="#bbb"/><text x="202" y="44" fill="#bbb">10</text>
      <circle cx="214" cy="76"  r="5" fill="#bbb"/><text x="202" y="80" fill="#bbb">9</text>
      <circle cx="214" cy="112" r="5" fill="#bbb"/><text x="202" y="116" fill="#bbb">8</text>
      <circle cx="214" cy="148" r="5" fill="#bbb"/><text x="202" y="152" fill="#bbb">7</text>
      <circle cx="214" cy="184" r="5" fill="#bbb"/><text x="202" y="188" fill="#bbb">6</text>
      <circle cx="214" cy="220" r="5" fill="#bbb"/><text x="202" y="224" fill="#bbb">5</text>
      <circle cx="214" cy="256" r="6" fill="#fa0"/><text x="202" y="260">GPIO4</text>
      <circle cx="214" cy="292" r="6" fill="#4af"/><text x="202" y="296">GPIO3</text>
    </g>
  </g>

  <!-- ===== Probe ===== -->
  <g transform="translate(860,150)">
    <rect x="0" y="0" width="170" height="300" rx="10" fill="#f2f2f2" stroke="#555" stroke-width="2"/>
    <text x="85" y="28" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">BLTouch clone</text>
    <text x="85" y="46" font-size="11" text-anchor="middle" fill="#555">3-pin servo + 2-pin Z-min</text>
    <g font-size="13" fill="#111">
      <circle cx="0" cy="80"  r="7" fill="#7a4a1f"/><text x="14" y="84">Brown: GND</text>
      <circle cx="0" cy="120" r="7" fill="#e22"/><text x="14" y="124">Red: +5V</text>
      <circle cx="0" cy="160" r="7" fill="#f80"/><text x="14" y="164">Orange: control</text>
      <circle cx="0" cy="220" r="7" fill="#111"/><text x="14" y="224">Black: GND</text>
      <circle cx="0" cy="260" r="7" fill="#fff" stroke="#111"/><text x="14" y="264">White: Z-min out</text>
    </g>
    <rect x="70" y="300" width="30" height="40" fill="#e9c38f" stroke="#555"/>
    <line x1="85" y1="340" x2="85" y2="372" stroke="#888" stroke-width="4"/>
    <text x="85" y="392" font-size="11" text-anchor="middle" fill="#555">pin</text>
  </g>

  <!-- red: 5V -->
  <polyline points="76,150 40,150 40,96 720,96 720,270 860,270" fill="none" stroke="#e22" stroke-width="3"/>
  <!-- GND: board GND to brown and black -->
  <polyline points="76,186 26,186 26,480 760,480 760,230 860,230" fill="none" stroke="#111" stroke-width="3"/>
  <polyline points="760,370 860,370" fill="none" stroke="#111" stroke-width="3"/>
  <circle cx="760" cy="370" r="5" fill="#111"/>
  <!-- control -->
  <polyline points="274,366 560,366 560,310 860,310" fill="none" stroke="#f80" stroke-width="3"/>
  <text x="580" y="302" font-size="12" fill="#111">50 Hz servo pulses (3.3 V logic)</text>
  <!-- signal -->
  <polyline points="274,402 296,402 296,410 860,410" fill="none" stroke="#4af" stroke-width="3"/>
  <text x="420" y="400" font-size="12" fill="#111">direct; internal pull-up on GPIO3</text>

  <!-- notes -->
  <g font-size="13" fill="#222">
    <text x="30" y="530" font-weight="bold" fill="#b00">Before connecting the white wire: prove it never drives 5 V</text>
    <text x="30" y="552">The C3's pins are not 5 V tolerant. This wiring is safe only if the probe's output is open-drain (BLTouch default).</text>
    <text x="30" y="574">1. Wire everything except white. Flash, power up, press probe_check on the ESPHome page (pin up + touch mode = output "triggered").</text>
    <text x="30" y="596">2. Meter from white to GND. About 0 V or floating: open-drain, connect it. 5 V: press probe_set_od_mode, power-cycle, measure again.</text>
    <text x="30" y="618">3. Still 5 V: this clone can't do open-drain. Put a 10k resistor in series in the white wire (the clamp current is then ~0.15 mA).</text>
    <text x="30" y="652" font-weight="bold">Power</text>
    <text x="30" y="674">USB-C lead to the board (5 V 1 A charger or the OctoPrint PC), routed with the laser cable. The probe runs from the board's 5V pin.</text>
    <text x="30" y="696">If the board resets when the pin deploys, add a 470 µF capacitor across 5V and GND at the probe plug.</text>
    <text x="30" y="718">Noise spikes on the signal are rejected in firmware: a trigger must stay high for 100 µs to count.</text>
  </g>
</svg>
